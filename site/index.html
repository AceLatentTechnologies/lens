<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.github.com; frame-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens</title>
<link rel="stylesheet" href="lens.css">
</head>
<body>
<header>
  <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="key" aria-label="key">
  <button id="load" type="button">Load</button>
  <button id="refresh" type="button">Refresh</button>
  <button id="forget" type="button">Forget</button>
  <label><input id="remember" type="checkbox"> remember in this tab</label>
  <span id="status" role="status"></span>
</header>
<div id="target" role="note"></div>
<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <div id="confirm-box">
    <h2 id="confirm-title">This link widens the owners in scope</h2>
    <p>The view you load can read whatever the key can read in these owners as well. Load only if you trust the target and these owners.</p>
    <div id="confirm-body"></div>
    <p><button id="confirm-yes" type="button">Load with these owners</button> <button id="confirm-no" type="button">Cancel</button></p>
  </div>
</div>
<main id="stage"></main>
<!-- data, not code: limits and the default owner scope. The address hash may only tighten them. -->
<script type="application/json" id="defaults">{"pollMin":5,"pollMax":86400,"perMin":120,"perHour":3000,"inflight":6,"bytes":2000000,"owners":"target","ownersMax":3,"siteFiles":200,"siteBytes":8000000,"siteDepth":8,"siteRoot":0,"siteMimes":{"html":"text/html","htm":"text/html","css":"text/css","js":"text/javascript","mjs":"text/javascript","json":"application/json","txt":"text/plain","svg":"image/svg+xml","png":"image/png","jpg":"image/jpeg","jpeg":"image/jpeg","gif":"image/gif","webp":"image/webp","ico":"image/x-icon","woff":"font/woff","woff2":"font/woff2","ttf":"font/ttf","otf":"font/otf"}}</script>
<script src="loader.js"></script>
</body>
</html>
